<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Planner</title>
<style>{{ css }}</style>
</head>
<body class="theme-{{ t.preset }} deco-{{ t.decoration }} cards-{{ t.cards }} cover-{{ t.cover_layout }} motif-{{ t.motif_kind }}{{ 'digital' if digital else 'printable' }} {{ 'ink' if t.ink_saving else '' }} {{ 'landscape' if g.landscape else 'portrait' }}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="geo" width="40" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="{{ t.accent }}" stroke-width="1.1">
        <path d="M20 4 L24.7 15.3 L36 20 L24.7 24.7 L20 36 L15.3 24.7 L4 20 L15.3 15.3 Z"/>
        <rect x="11" y="11" width="18" height="18" transform="rotate(45 20 20)"/>
        <rect x="11" y="11" width="18" height="18"/>
      </g>
    </pattern>
  </defs>
</svg>
{{ body }}
{% if preview %}
<script>
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  parent.postMessage({ plannerGoto: a.getAttribute('href').slice(1) }, '*');
});
</script>
{% endif %}
</body>
</html>
